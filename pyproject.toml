[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length
    "E402",  # Module level import not at top of file
    "F403",  # from app.streamlit_app import *
    "F405",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
"scripts/*" = ["F401"]
