name: Golden data validation

on:
  push:
    paths:
      - "data/rag_golden_set.json"
      - "data/nlq_golden_set.json"
      - "data/demo_sales_warehouse/**"
      - "scripts/validate_golden_data.py"
      - "scripts/rag_eval_metrics.py"
      - "tests/test_golden_data_validation.py"
      - ".github/workflows/golden-data.yml"
  pull_request:
    paths:
      - "data/rag_golden_set.json"
      - "data/nlq_golden_set.json"
      - "data/demo_sales_warehouse/**"
      - "scripts/validate_golden_data.py"
      - "scripts/rag_eval_metrics.py"
      - "tests/test_golden_data_validation.py"
      - ".github/workflows/golden-data.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest python-docx pypdf
      - run: python -m scripts.validate_golden_data
      - run: python -m pytest tests/test_golden_data_validation.py -q
