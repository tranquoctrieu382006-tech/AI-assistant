name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Run Ruff Check
        run: ruff check .

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: ai_assistant_test
          NLQ_READER_PASSWORD: secret_nlq_reader
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/ai_assistant_test
      NLQ_DATABASE_URL: postgresql://ai_nlq_reader:secret_nlq_reader@localhost:5432/ai_assistant_test
      APP_API_KEY: ci-test-key-with-more-than-32-characters
      APP_WORKERS: 1

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Initialize PostgreSQL schema & roles
        run: |
          PGPASSWORD=test_password_123 psql -h localhost -U postgres -d ai_assistant_test -f docker/init-db/01_init.sql
          PGPASSWORD=test_password_123 psql -h localhost -U postgres -d ai_assistant_test -f data/demo_sales_warehouse/schema_seed.sql
          POSTGRES_USER=postgres POSTGRES_DB=ai_assistant_test NLQ_READER_PASSWORD=secret_nlq_reader PGPASSWORD=test_password_123 bash docker/init-db/03_create_reader_role.sh
      - name: Run test suite with JUnit XML report
        run: python -m pytest -v --junitxml=test-results.xml

  docker:
    name: Docker Build & Compose Health Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose config
        env:
          POSTGRES_PASSWORD: test_password_123
          NLQ_READER_PASSWORD: secret_nlq_reader
          APP_API_KEY: ci-test-key-with-more-than-32-characters
      - name: Create temporary .env for Compose services
        run: |
          echo "POSTGRES_PASSWORD=test_password_123" >> .env
          echo "NLQ_READER_PASSWORD=secret_nlq_reader" >> .env
          echo "APP_API_KEY=ci-test-key-with-more-than-32-characters" >> .env
      - name: Test Docker Compose Multi-Service Health
        run: |
          docker compose up -d
          for i in {1..40}; do
            APP_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' ai-assistant-backend 2>/dev/null || echo "starting")
            UI_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' ai-assistant-ui 2>/dev/null || echo "starting")
            if [ "$APP_HEALTH" = "healthy" ] && [ "$UI_HEALTH" = "healthy" ]; then
              echo "Both backend and UI services are healthy!"
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:8000/api/health/live
          curl --fail http://localhost:8501/_stcore/health
          docker compose down -v
        env:
          POSTGRES_PASSWORD: test_password_123
          NLQ_READER_PASSWORD: secret_nlq_reader
          APP_API_KEY: ci-test-key-with-more-than-32-characters
